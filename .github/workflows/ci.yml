name: FolioTrack CI/CD Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  backend-ci:
    name: Backend CI (Go)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Get dependencies
        run: |
          cd backend
          go mod download

      - name: Build backend
        run: |
          cd backend
          go build -v -o foliotrack-backend .

      - name: Run backend tests
        run: |
          cd backend
          go test -v ./...

  frontend-ci:
    name: Frontend CI (Vue 3)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd frontend
          npm install

      - name: Build frontend assets
        run: |
          cd frontend
          npm run build
