version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: foliotrack-db
    command: --default-authentication-plugin=mysql_native_password
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: foliotrack
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: foliotrack-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: foliotrack-backend:latest
    container_name: foliotrack-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DB_DSN=root:rootpass@tcp(db:3306)/foliotrack?charset=utf8mb4&parseTime=True&loc=Local
      - JWT_SECRET=foliotrack-super-secret-key-change-in-prod
      - REDIS_ADDR=redis:6379
      - ADMIN_PASSWORD=admin123
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: foliotrack-frontend:latest
    container_name: foliotrack-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  db_data:
