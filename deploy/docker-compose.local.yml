services:
  db:
    image: mysql:8.0
    container_name: foliotrack-local-db
    command: --default-authentication-plugin=mysql_native_password
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: foliotrack
    ports:
      - "13306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: foliotrack-local-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: foliotrack-backend:local
    container_name: foliotrack-local-backend
    restart: unless-stopped
    ports:
      - "18080:8080"
    environment:
      PORT: "8080"
      DB_DSN: root:rootpass@tcp(db:3306)/foliotrack?charset=utf8mb4&parseTime=True&loc=Local
      JWT_SECRET: local-dev-secret
      REDIS_ADDR: redis:6379
      ADMIN_PASSWORD: admin123
      ALLOW_REGISTRATION: "true"
      REGISTRATION_INVITE_CODE: "yaoqingma"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: foliotrack-frontend:local
    container_name: foliotrack-local-frontend
    restart: unless-stopped
    ports:
      - "8088:80"
    depends_on:
      - backend

volumes:
  db_data:
